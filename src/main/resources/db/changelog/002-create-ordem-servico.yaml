databaseChangeLog:
  - changeSet:
      id: 002-01-create-ordem-servico
      author: oscontrol
      comment: Cria a tabela de ordens de serviço.
      changes:
        - createTable:
            tableName: ordem_servico
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_ordem_servico
                    nullable: false
              - column:
                  name: numero
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: descricao
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: horas_previstas
                  type: NUMERIC(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: valor_hora
                  type: NUMERIC(18,2)
                  constraints:
                    nullable: false
              - column:
                  name: data_abertura
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: categoria_servico_id
                  type: BIGINT
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: ordem_servico

  - changeSet:
      id: 002-02-unique-numero-ordem-servico
      author: oscontrol
      comment: Garante a identificação única da ordem de serviço.
      changes:
        - addUniqueConstraint:
            tableName: ordem_servico
            columnNames: numero
            constraintName: uk_ordem_servico_numero
      rollback:
        - dropUniqueConstraint:
            tableName: ordem_servico
            constraintName: uk_ordem_servico_numero

  - changeSet:
      id: 002-03-foreign-key-categoria-servico
      author: oscontrol
      comment: Vincula cada ordem de serviço a uma categoria existente.
      changes:
        - addForeignKeyConstraint:
            baseTableName: ordem_servico
            baseColumnNames: categoria_servico_id
            referencedTableName: categoria_servico
            referencedColumnNames: id
            constraintName: fk_ordem_servico_categoria_servico
            onDelete: RESTRICT
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: ordem_servico
            constraintName: fk_ordem_servico_categoria_servico

  - changeSet:
      id: 002-04-check-horas-previstas
      author: oscontrol
      comment: Impede horas previstas negativas.
      changes:
        - sql:
            sql: >
              ALTER TABLE ordem_servico
              ADD CONSTRAINT ck_ordem_servico_horas_previstas
              CHECK (horas_previstas >= 0)
      rollback:
        - sql:
            sql: >
              ALTER TABLE ordem_servico
              DROP CONSTRAINT ck_ordem_servico_horas_previstas

  - changeSet:
      id: 002-05-check-valor-hora
      author: oscontrol
      comment: Impede valores por hora negativos.
      changes:
        - sql:
            sql: >
              ALTER TABLE ordem_servico
              ADD CONSTRAINT ck_ordem_servico_valor_hora
              CHECK (valor_hora >= 0)
      rollback:
        - sql:
            sql: >
              ALTER TABLE ordem_servico
              DROP CONSTRAINT ck_ordem_servico_valor_hora

  - changeSet:
      id: 002-06-check-status-ordem-servico
      author: oscontrol
      comment: Restringe o status aos estados válidos da ordem de serviço.
      changes:
        - sql:
            sql: >
              ALTER TABLE ordem_servico
              ADD CONSTRAINT ck_ordem_servico_status
              CHECK (status IN ('ABERTA', 'EM_ANDAMENTO', 'CONCLUIDA', 'CANCELADA'))
      rollback:
        - sql:
            sql: >
              ALTER TABLE ordem_servico
              DROP CONSTRAINT ck_ordem_servico_status
