databaseChangeLog:
  - changeSet:
      id: 001-01-create-categoria-servico
      author: oscontrol
      comment: Cria a tabela que classifica as ordens de serviço.
      changes:
        - createTable:
            tableName: categoria_servico
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_categoria_servico
                    nullable: false
              - column:
                  name: nome
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: categoria_servico

  - changeSet:
      id: 001-02-check-status-categoria-servico
      author: oscontrol
      comment: Restringe o status aos valores do cadastro de categoria.
      changes:
        - sql:
            sql: >
              ALTER TABLE categoria_servico
              ADD CONSTRAINT ck_categoria_servico_status
              CHECK (status IN ('ATIVO', 'INATIVO'))
      rollback:
        - sql:
            sql: >
              ALTER TABLE categoria_servico
              DROP CONSTRAINT ck_categoria_servico_status
